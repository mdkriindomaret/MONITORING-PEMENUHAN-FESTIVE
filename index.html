<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Monitoring Pemenuhan Festive</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="topbar">
        <div class="topbar-inner">
            <div class="brand">
                <div class="brand-mark">📊</div>
                <div>
                    <h1>DASHBOARD MONITORING FESTIVE</h1>
                    <p>Indomaret &amp; Indogrosir 2026-2027</p>
                </div>
            </div>
            <div class="nav-links">
                <a href="index.html" class="nav-btn active">📊 Ringkasan Dashboard</a>
                <a href="upload.html" class="nav-btn">📤 Unggah Database Excel</a>
            </div>
        </div>
    </header>

    <main>
        <section class="cards">
            <div class="card">
                <div class="card-label">Total Item Produk</div>
                <div class="card-value" id="stat-total">–</div>
            </div>
            <div class="card yellow">
                <div class="card-label">Total Principal</div>
                <div class="card-value" id="stat-principal">–</div>
            </div>
            <div class="card">
                <div class="card-label">Departemen Terdaftar</div>
                <div class="card-value" id="stat-dept">–</div>
            </div>
            <div class="card red">
                <div class="card-label">Status Koneksi</div>
                <div class="card-value" style="font-size: 1.1rem; color: #10b981;" id="stat-status">Terhubung Aktif</div>
            </div>
        </section>

        <section class="panel">
            <div class="toolbar">
                <h2>Data Master Produk</h2>
                <div class="search">
                    <input type="search" id="search" placeholder="Cari data produk atau PLU..." onkeyup="filterTable()" autocomplete="off">
                </div>
            </div>
            <div class="table-wrap">
                <table id="tabel-data">
                    <thead id="tabel-head"></thead>
                    <tbody id="tabel-body">
                        <tr><td colspan="100%" style="text-align: center; padding: 40px; color: #6b7789;">Memuat data dari server...</td></tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script>
        const apiURL = 'https://script.google.com/macros/s/AKfycbwFuBr8bsJmEFbpcgIoYyPfzEUIy2vePUftdWPrNMph6c9-yRsocVlqHh4KAVWGGZYB6Q/exec';
        let globalData = [];
        let globalColumns = [];

        fetch(apiURL)
            .then(res => res.json())
            .then(data => {
                if (!Array.isArray(data) || data.length === 0) return;
                globalData = data;
                globalColumns = Object.keys(data[0]);

                document.getElementById('stat-total').textContent = data.length.toLocaleString('id-ID');
                document.getElementById('stat-principal').textContent = new Set(data.map(i => i['PRINCIPLE'])).size;
                document.getElementById('stat-dept').textContent = new Set(data.map(i => i['DEP'])).size;

                renderTable(data);
            })
            .catch(err => {
                document.getElementById('stat-status').textContent = 'Gagal Terhubung';
                document.getElementById('stat-status').style.color = '#e3262b';
            });

        function renderTable(data) {
            const thead = document.getElementById('tabel-head');
            const tbody = document.getElementById('tabel-body');
            thead.innerHTML = '';
            tbody.innerHTML = '';

            let trHead = document.createElement('tr');
            globalColumns.forEach(col => {
                let th = document.createElement('th');
                th.textContent = col;
                trHead.appendChild(th);
            });
            thead.appendChild(trHead);

            data.forEach(item => {
                let tr = document.createElement('tr');
                globalColumns.forEach(col => {
                    let td = document.createElement('td');
                    td.textContent = item[col] !== undefined ? item[col] : '';
                    tr.appendChild(td);
                });
                tbody.appendChild(tr);
            });
        }

        function filterTable() {
            let keyword = document.getElementById('search').value.toLowerCase();
            let filtered = globalData.filter(item => 
                Object.values(item).some(val => String(val).toLowerCase().includes(keyword))
            );
            renderTable(filtered);
        }
    </script>
</body>
</html>
